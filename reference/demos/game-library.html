<style>
:root{--yl:#ffd900;--bg:#060608;--line:#2a2a33}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:#fff;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;display:block}

.vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 92% at 50% 42%,transparent 52%,rgba(0,0,0,.62))}
.grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.logo{position:absolute;top:20px;left:24px;line-height:1.3}
.logo b{font-size:20px;font-weight:900;font-style:italic}
.logo span{display:block;font-size:10px;letter-spacing:3px;color:#8b93a4;font-weight:700}
.archives{position:absolute;top:18px;right:24px;display:flex;align-items:center;background:rgba(9,9,12,.86);border:1px solid var(--line);clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 14px)}
.archives .bars{width:26px;height:30px;margin-left:12px;background:repeating-linear-gradient(90deg,var(--yl) 0 3px,transparent 3px 7px)}
.archives .txt{padding:6px 16px 8px 10px}
.archives small{display:block;font-size:9px;letter-spacing:2.5px;color:#7f8798;font-weight:700}
.archives b{display:block;font-size:15px;font-weight:900;font-style:italic;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{position:absolute;top:74px;right:24px;font-size:13px;font-weight:900;font-style:italic;letter-spacing:2px;color:#aab0bf}
#count em{font-style:normal;color:var(--yl);font-size:15px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:11;pointer-events:auto;background:none;border:0;color:#e8ebf2;cursor:pointer;padding:16px 10px;opacity:.85;transition:.18s}
.arrow:hover{color:var(--yl);opacity:1}

#prev{left:2px}#next{right:2px}

.badge>span{display:inline-block;transform:skewX(8deg)}
.chip{font-size:11.5px;font-weight:700;color:#c7ccd8;background:rgba(255,255,255,.07);border:1px solid #33343e;padding:3px 9px;transform:skewX(-8deg)}

.h{color:#9aa1b0;font-size:12px;font-weight:700;letter-spacing:1px}

#iTags i,#dTags i{font-style:normal;font-size:11px;color:#a9b1c0;border:1px solid #3a3d49;padding:2px 8px;margin-right:6px}

const canvas=$('#stage');

function gridCanvas(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');

 x.fillStyle='rgba(255,217,0,.05)';x.fillRect(0,252,256,4);return c;}

function glowCanvas(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 const g=x.createRadialGradient(128,128,10,128,128,128);g.addColorStop(0,'rgba(255,244,200,.9)');g.addColorStop(1,'rgba(255,244,200,0)');
 x.fillStyle=g;x.fillRect(0,0,256,256);return c;}
const pool=new THREE.Mesh(new THREE.PlaneGeometry(7.5,7.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(glowCanvas()),transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));
pool.rotation.x=-Math.PI/2;pool.position.set(0,-1.68,.2);scene.add(pool);

function chevCanvas(){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');
 x.fillStyle='#ffd900';x.beginPath();x.moveTo(6,4);x.lineTo(64,40);x.lineTo(122,4);x.lineTo(122,22);x.lineTo(64,60);x.lineTo(6,22);x.closePath();x.fill();return c;}
const chev=new THREE.Mesh(new THREE.PlaneGeometry(.55,.28),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(chevCanvas()),transparent:true,depthWrite:false}));
chev.position.set(0,1.98,.55);scene.add(chev);

const dGeo=new THREE.BufferGeometry();{const N=220,a=new Float32Array(N*3);
 for(let i=0;i<N;i++){a[i*3]=(Math.random()-.5)*26;a[i*3+1]=-1.5+Math.random()*6;a[i*3+2]=-6+Math.random()*9;}
 dGeo.setAttribute('position',new THREE.BufferAttribute(a,3));}
const dust=new THREE.Points(dGeo,new THREE.PointsMaterial({color:0x93a8cc,size:.03,transparent:true,opacity:.5,depthWrite:false}));
scene.add(dust);

/* ============ 4. 程序化封面 / 书脊 / 背面 ============ */
function texOf(cv){const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
 t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}

function makeCover(g,i){
 const W=560,H=780,sharp=document.createElement('canvas');sharp.width=W;sharp.height=H;
 const x=sharp.getContext('2d');
 const g1=x.createLinearGradient(0,H,W,0);g1.addColorStop(0,g.pal[1]);g1.addColorStop(1,g.pal[0]);
 x.fillStyle=g1;x.fillRect(0,0,W,H);
 const rg=x.createRadialGradient(W*.22,H*.16,20,W*.22,H*.16,W*.85);
 rg.addColorStop(0,'rgba(255,255,255,.15)');rg.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=rg;x.fillRect(0,0,W,H);
 x.save();x.translate(W*.5,H*.5);x.rotate(-.42);
 x.fillStyle='rgba(0,0,0,.32)';x.fillRect(-W,-46,W*2,128);
 x.fillStyle='rgba(255,255,255,.10)';x.fillRect(-W,98,W*2,24);
 x.fillStyle='rgba(255,217,0,.9)';x.fillRect(-W,-70,W*2,10);x.restore();
 x.save();x.globalAlpha=.12;x.fillStyle='#fff';x.font='900 210px Arial';x.textAlign='right';
 x.fillText(String(i+1).padStart(2,'0'),W-14,H-120);x.restore();
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,54);
 x.fillStyle='#ffd900';x.font='900 21px Arial';x.textAlign='left';x.textBaseline='middle';
 x.fillText('QUAX · TAPE '+String(i+1).padStart(2,'0'),18,28);
 x.fillStyle='#dfe3ec';x.font='700 16px Arial';x.textAlign='right';x.fillText('GAME ARCHIVE',W-16,28);
 x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=16;
 x.beginPath();x.arc(W-96,140,52,0,Math.PI*2);
 x.fillStyle=g.rating!=null?'#ffd900':'rgba(20,20,24,.85)';x.fill();x.shadowBlur=0;
 x.fillStyle=g.rating!=null?'#111':'#8b93a6';x.font='900 44px Arial';x.textAlign='center';
 x.fillText(g.rating!=null?String(g.rating):({completed:'✓',playing:'▶',dropped:'✕',wishlist:'+'}[g.status]),W-96,142);
 x.fillStyle='rgba(255,255,255,.65)';x.font='700 13px Arial';
 x.fillText(g.rating!=null?'RATING':STATUS_META[g.status].label,W-96,206);
 const chars=[...g.t];const use=chars.length>10?chars.slice(0,10):chars;
 const fs=use.length>=10?52:use.length>=8?62:use.length>=6?72:88;
 x.font=`900 ${fs}px "Noto Sans SC","PingFang SC",sans-serif`;x.textAlign='center';x.textBaseline='middle';
 x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=14;x.shadowOffsetY=5;x.fillStyle='#fff';
 use.forEach((ch,j)=>x.fillText(ch,92,112+fs*1.04*j+fs*.55));
 x.shadowBlur=0;x.shadowOffsetY=0;
 let efs=40;do{x.font=`900 ${efs}px Arial`}while(x.measureText(g.en).width>W-70&&(efs-=2)>14);
 x.fillStyle='rgba(255,255,255,.92)';x.fillText(g.en,W/2,H-88);
 x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,H-58,W,58);
 x.fillStyle='#ffd900';x.font='900 18px Arial';x.textAlign='left';x.fillText('QUAX STUDIO',18,H-29);
 x.fillStyle='#cfd3dd';let bx=W-150;
 while(bx<W-24){const w2=Math.random()<.3?3:1.5;x.fillRect(bx,H-46,w2,32);bx+=w2+2+Math.random()*4;}
 return sharp;
}
function blurFrom(src){ // 下采样再放大 → 廉价可靠的「失焦」效果（兼容不支持 ctx.filter 的浏览器）
 const k=.05,t=document.createElement('canvas');
 t.width=Math.max(2,src.width*k|0);t.height=Math.max(2,src.height*k|0);
 t.getContext('2d').drawImage(src,0,0,t.width,t.height);
 const o=document.createElement('canvas');o.width=src.width;o.height=src.height;
 const ox=o.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(t,0,0,o.width,o.height);return o;
}
function makeSpine(g){const c=document.createElement('canvas');c.width=96;c.height=780;const x=c.getContext('2d');
 const g1=x.createLinearGradient(0,0,96,0);g1.addColorStop(0,'#232329');g1.addColorStop(1,'#0a0a0d');
 x.fillStyle=g1;x.fillRect(0,0,96,780);x.fillStyle='#ffd900';x.fillRect(0,0,96,8);x.fillRect(0,772,96,8);
 x.fillStyle='#e8eaf1';x.font='900 30px "Noto Sans SC","PingFang SC",sans-serif';x.textAlign='center';x.textBaseline='middle';
 [...g.t].slice(0,14).forEach((ch,j)=>x.fillText(ch,48,52+j*42));return c;}
function makeBack(){const c=document.createElement('canvas');c.width=560;c.height=780;const x=c.getContext('2d');
 x.fillStyle='#0d0d12';x.fillRect(0,0,560,780);x.strokeStyle='rgba(255,255,255,.04)';
 for(let i=0;i<560;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,780);x.stroke();}
 x.fillStyle='#3c414e';x.font='900 30px Arial';x.textAlign='center';x.fillText('QUAX GAME ARCHIVE',280,380);
 x.fillStyle='#2a2e38';x.font='700 16px Arial';x.fillText('REW · PLAY · FF',280,416);return c;}
function coverFit(cv,img){const x=cv.getContext('2d'),W=cv.width,H=cv.height;
 const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
 x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
 const g=x.createLinearGradient(0,H*.45,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.82)');
 x.fillStyle=g;x.fillRect(0,0,W,H);}

/* ============ 5. 档案盒构建 ============ */
const caseGeo=new THREE.BoxGeometry(2,2.8,.24);
const backMat=new THREE.MeshStandardMaterial({map:texOf(makeBack()),roughness:.85});
const darkMat=new THREE.MeshStandardMaterial({color:0x0d0d11,roughness:.9});

function buildCases(items){
 cases.forEach(m=>{const u=m.userData;u.sharp.dispose();u.blur.dispose();
  u.frontMat.dispose();u.spineMat.map.dispose();u.spineMat.dispose();scene.remove(m);});
 cases.length=0;
 items.forEach((g,i)=>{
  const sharpCv=makeCover(g,i),blurCv=blurFrom(sharpCv);
  const sharpT=texOf(sharpCv),blurT=texOf(blurCv);
  const frontMat=new THREE.MeshStandardMaterial({map:sharpT,roughness:.5,metalness:.05});
  const spineMat=new THREE.MeshStandardMaterial({map:texOf(makeSpine(g)),roughness:.72});
  const mesh=new THREE.Mesh(caseGeo,[spineMat,spineMat,darkMat,darkMat,frontMat,backMat]);
  mesh.userData={game:g,i,frontMat,spineMat,sharp:sharpT,blur:blurT,isBlur:false,spawn:-(i*.045)};
  g._coverURL=sharpCv.toDataURL('image/jpeg',.82);
  if(g.cover){ // 真实封面：加载后替换纹理
   const img=new Image();img.crossOrigin='anonymous';
   img.onload=()=>{const x=sharpCv.getContext('2d');x.clearRect(0,0,560,780);coverFit(sharpCv,img);
    x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,722,560,58);
    x.fillStyle='#ffd900';x.textAlign='left';x.textBaseline='middle';x.font='900 18px Arial';x.fillText('QUAX STUDIO',18,752);
    x.fillStyle='rgba(255,255,255,.94)';x.textAlign='center';x.font='900 26px Arial';x.fillText(g.en,280,701);
    sharpT.needsUpdate=true;blurT.image=blurFrom(sharpCv);blurT.needsUpdate=true;
    g._coverURL=sharpCv.toDataURL('image/jpeg',.82);};
   img.src=g.cover;
  }
  scene.add(mesh);cases.push(mesh);
 });
}

/* ============ 6. 逐帧布局：一切由「到焦点的连续距离 d」驱动 ============ */
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 dragCur+=(dragTarget-dragCur)*(1-Math.exp(-dt*9));
 cur+=(target-cur)*(1-Math.exp(-dt*7.5));
 if(Math.abs(target-cur)<.0005)cur=target;
 if(list.length){
  cases.forEach(m=>{
   const u=m.userData,d=u.i-cur,a=Math.abs(d),s=d>=0?1:-1,e=Math.min(a,1);
   const x=(a>.002?s:0)*2.3*Math.pow(a,.82);
   const z=-1.05*Math.pow(a,1.12);
   const sc=THREE.MathUtils.lerp(1.14,.94,e);
   u.spawn+=dt;
   const sp=THREE.MathUtils.clamp(u.spawn/.55,0,1),se=1-Math.pow(1-sp,3);
   const bob=REDUCED?0:Math.sin(t*1.25)*.035*(1-e);
   m.position.set(x,-1.4+1.4*sc+bob-(1-se)*2.8,z);
   m.rotation.y=THREE.MathUtils.lerp(-.15,-s*.55,e)+dragCur*(1-e);
   m.rotation.z=THREE.MathUtils.lerp(.012,-s*.05,e);
   m.scale.setScalar(sc*(.78+.22*se));
   const dim=THREE.MathUtils.lerp(1,.3,e);
   u.frontMat.color.setScalar(dim);u.spineMat.color.setScalar(dim*.85);
   const want=a>.5;
   if(want!==u.isBlur){u.isBlur=want;u.frontMat.map=want?u.blur:u.sharp;u.frontMat.needsUpdate=true;}
   m.visible=a<6.5;
  });
  chev.visible=true;chev.position.y=1.98+Math.sin(t*2.4)*.06;
 }else chev.visible=false;
 dust.rotation.y=t*.02;
 camera.position.x+=(mx*.85-camera.position.x)*.045;
 camera.position.y+=((.5-my*.45)-camera.position.y)*.045;
 camera.lookAt(0,.12,0);
 composer.render();
}

/* ============ 7. 交互 ============ */
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(cx,cy){ndc.x=cx/innerWidth*2-1;ndc.y=-(cy/innerHeight)*2+1;
 raycaster.setFromCamera(ndc,camera);
 const hits=raycaster.intersectObjects(cases.filter(c=>c.visible),false);
 return hits.length?hits[0].object:null;}

canvas.addEventListener('pointerdown',e=>{isDown=true;movedPx=0;downX=e.clientX;
 canvas.classList.add('grab');canvas.setPointerCapture(e.pointerId);});
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
 if(isDown){const dx=e.clientX-downX;movedPx=Math.max(movedPx,Math.abs(dx));
  dragTarget=THREE.MathUtils.clamp(dx*.0045,-.55,.55);}});
addEventListener('pointerup',e=>{if(!isDown)return;isDown=false;canvas.classList.remove('grab');
 const dx=e.clientX-downX;dragTarget=0;
 if(movedPx<6){const hit=pick(e.clientX,e.clientY);
  if(hit){hit.userData.i===Math.round(cur)?openDetail(list[hit.userData.i]):setTarget(hit.userData.i);}}
 else if(Math.abs(dx)>70)navigate(dx<0?1:-1);});

let wheelT=0,accY=0;
addEventListener('wheel',e=>{if(detailOpen)return;e.preventDefault();
 accY+=e.deltaY;const now=performance.now();
 if(now-wheelT>240&&Math.abs(accY)>25){navigate(accY>0?1:-1);wheelT=now;accY=0;}},{passive:false});

addEventListener('keydown',e=>{
 if(detailOpen){if(e.key==='Escape')closeDetail();return;}
 if(e.key==='ArrowRight')navigate(1);
 else if(e.key==='ArrowLeft')navigate(-1);
 else if(e.key==='Enter')openDetail(list[target]);});

function setTarget(i){const ni=THREE.MathUtils.clamp(i,0,list.length-1);
 if(ni!==target){target=ni;syncHUD();}}
function navigate(dir){setTarget(target+dir);}

/* ============ 8. HUD / 详情 / 筛选 ============ */
function syncHUD(){
 const g=list[target];if(!g)return;
 const st=STATUS_META[g.status];
 $('#hudTitle').textContent=g.t;
 $('#cNow').textContent=String(target+1).padStart(2,'0');
 $('#cAll').textContent=String(list.length).padStart(2,'0');
 $('#iStatus').firstElementChild.textContent=st.label;
 $('#iStatus').style.color=st.color;$('#iStatus').style.borderColor=st.color;
 $('#iHours').textContent=g.hours!=null?g.hours+' h':'时长 —';
 $('#iRating').textContent=g.rating!=null?'★ '+g.rating+' / 10':'未评分';
 $('#iTitle').textContent=g.t;$('#iEn').textContent=g.en;
 $('#iTags').innerHTML=g.tags.map(t=>`<i>${t}</i>`).join('');
 $('#iReview').textContent=g.review;
 $('#prev').classList.toggle('dim',target<=0);
 $('#next').classList.toggle('dim',target>=list.length-1);
}
function openDetail(g){if(!g)return;detailOpen=true;
 $('#dCover').src=g._coverURL||'';
 $('#dTitle').textContent=g.t;$('#dEn').textContent=g.en;
 const st=STATUS_META[g.status];
 $('#dMeta').innerHTML=
  `<span class="badge" style="color:${st.color};border-color:${st.color}"><span>${st.label}</span></span>`+
  `<span class="chip"><span>${g.hours!=null?g.hours+' h':'时长 —'}</span></span>`+
  `<span class="chip"><span>${g.rating!=null?'★ '+g.rating+' / 10':'未评分'}</span></span>`;
 $('#dTags').innerHTML=g.tags.map(t=>`<i>${t}</i>`).join('');
 $('#dReview').textContent=g.review||'（暂无评价）';
 $('#detail').classList.add('show');}
function closeDetail(){detailOpen=false;$('#detail').classList.remove('show');}
 $('#more').onclick=()=>openDetail(list[target]);
 $('#close').onclick=closeDetail;
 $('#detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
 $('#prev').onclick=()=>navigate(-1);
 $('#next').onclick=()=>navigate(1);

const TABS=[['all','全部'],['completed','已通关'],['playing','游玩中'],['dropped','已弃坑'],['wishlist','愿望单']];
TABS.forEach(([k,label],idx)=>{
 const n=k==='all'?GAMES.length:GAMES.filter(g=>g.status===k).length;
 const b=document.createElement('button');
 b.className='tab'+(idx===0?' on':'');
 b.innerHTML=`<span>${label}<em>${n}</em></span>`;
 b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on');build(k==='all'?GAMES:GAMES.filter(g=>g.status===k));};
 $('#tabs').appendChild(b);
});

/* ============ 9. 启动 ============ */
function build(items){list=items;buildCases(items);cur=0;target=0;syncHUD();}
function onResize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
 camera.position.z=camera.aspect<.75?11.2:camera.aspect<1.25?8.8:7.2;}
addEventListener('resize',onResize);
const clock=new THREE.Clock();
function init(){build(GAMES);onResize();animate();$('#loader').classList.add('off');
 setTimeout(()=>{$('#hint').style.opacity='0';},7000);}
document.fonts&&document.fonts.ready
 ?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(init)
 :init();
</script>
</body>
</html>
