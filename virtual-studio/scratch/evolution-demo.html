<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智力演化模拟器 - Demo 预览</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(25, 27, 38, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #8b7355;
      --accent-glow: rgba(139, 115, 85, 0.35);
      --text: #f0ede6;
      --text-muted: #8e8d89;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 115, 85, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 115, 85, 0.08) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #dcd1c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Main Dashboard Layout */
    .dashboard {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 40px;
      margin-bottom: 45px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    /* Left Side: Radar Chart */
    .chart-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .radar-svg {
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 0 15px rgba(139, 115, 85, 0.15));
    }

    .radar-grid {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1px;
    }

    .radar-axis {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1px;
    }

    .radar-avg-poly {
      fill: rgba(139, 115, 85, 0.07);
      stroke: rgba(139, 115, 85, 0.3);
      stroke-width: 1px;
      stroke-dasharray: 3 3;
    }

    .radar-val-poly {
      fill: rgba(139, 115, 85, 0.22);
      stroke: var(--accent);
      stroke-width: 2.5px;
      transition: points 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .radar-dot {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 2px;
      r: 4.5px;
      transition: cx 0.5s cubic-bezier(0.25, 1, 0.5, 1), cy 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .radar-label {
      font-size: 10px;
      font-weight: 600;
      fill: var(--text-muted);
      font-family: monospace;
    }

    .radar-legend {
      display: flex;
      gap: 16px;
      margin-top: 15px;
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    /* Right Side: Capability details */
    .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .era-badge {
      align-self: flex-start;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .era-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .era-models {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .era-models strong {
      color: var(--text);
    }

    .milestone-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .milestone-box h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .milestone-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #dfdbd4;
    }

    /* Metrics numeric view */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .metric-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }

    .metric-name {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Interactive Timeline Slider Area */
    .slider-area {
      padding: 25px 30px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .slider-container {
      position: relative;
      margin-bottom: 15px;
    }

    /* Custom range input styling */
    .timeline-range {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      margin: 15px 0;
    }

    .timeline-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.1s;
    }

    .timeline-range::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
    }

    .tick {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: monospace;
      transition: color 0.2s, font-weight 0.2s;
    }

    .tick.active {
      color: var(--accent);
      font-weight: 700;
    }

    /* Play Button */
    .controls {
      display: flex;
      justify-content: center;
      margin-top: 15px;
      gap: 10px;
    }

    .play-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 15px var(--accent-glow);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI 智力演化模拟器</h1>
      <p class="subtitle">拉动时间轴，直观感受 2018 - 2026 跨越九年的大模型能力边界扩张历程</p>
    </header>

    <div class="dashboard">
      <!-- Left side: SVG Radar -->
      <div class="chart-container">
        <svg class="radar-svg" viewBox="0 0 200 200">
          <!-- Background Grid Rings -->
          <polygon class="radar-grid" points="100,20 180,80 150,170 50,170 20,80" />
          <polygon class="radar-grid" points="100,40 160,85 137.5,152.5 62.5,152.5 40,85" />
          <polygon class="radar-grid" points="100,60 140,90 125,135 75,135 60,90" />
          <polygon class="radar-grid" points="100,80 120,95 112.5,117.5 87.5,117.5 80,95" />

          <!-- Spokes -->
          <line class="radar-axis" x1="100" y1="100" x2="100" y2="20" />
          <line class="radar-axis" x1="100" y1="100" x2="180" y2="80" />
          <line class="radar-axis" x1="100" y1="100" x2="150" y2="170" />
          <line class="radar-axis" x1="100" y1="100" x2="50" y2="170" />
          <line class="radar-axis" x1="100" y1="100" x2="20" y2="80" />

          <!-- Axis Labels -->
          <text class="radar-label" x="100" y="12" text-anchor="middle">推理</text>
          <text class="radar-label" x="192" y="83" text-anchor="start">编码</text>
          <text class="radar-label" x="158" y="180" text-anchor="start">语言</text>
          <text class="radar-label" x="42" y="180" text-anchor="end">多模态</text>
          <text class="radar-label" x="8" y="83" text-anchor="end">Agent</text>

          <!-- Industry Average (Reference) -->
          <polygon class="radar-avg-poly" points="100,40 160,85 137.5,152.5 62.5,152.5 40,85" />

          <!-- Dynamic Value Polygon -->
          <polygon id="valPoly" class="radar-val-poly" points="100,100 100,100 100,100 100,100 100,100" />

          <!-- Value Dots -->
          <circle id="dot0" class="radar-dot" cx="100" cy="100" />
          <circle id="dot1" class="radar-dot" cx="100" cy="100" />
          <circle id="dot2" class="radar-dot" cx="100" cy="100" />
          <circle id="dot3" class="radar-dot" cx="100" cy="100" />
          <circle id="dot4" class="radar-dot" cx="100" cy="100" />
        </svg>

        <div class="radar-legend">
          <div class="legend-item">
            <div class="legend-color" style="background: var(--accent);"></div>
            <span>当前智力层</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="border: 1px dashed rgba(139, 115, 85, 0.5);"></div>
            <span>行业基准线</span>
          </div>
        </div>
      </div>

      <!-- Right side: Description & Scores -->
      <div class="details">
        <span class="era-badge" id="eraBadge">石器时代</span>
        <h2 class="era-title" id="eraTitle">2018年：语义起源</h2>
        <div class="era-models" id="eraModels">
          代表模型：<strong>GPT-1, BERT</strong>
        </div>

        <div class="milestone-box">
          <h4>能力里程碑</h4>
          <p class="milestone-desc" id="eraDesc">
            大模型起源初期。具备基本的单词和句子概率补全（Next Token Prediction）能力。几乎没有任何代码生成或多步逻辑推理能力，能回答极短的问题，但长度一旦超过几十个字符就会开始胡言乱语。
          </p>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-val" id="valReasoning">10</div>
            <div class="metric-name">推理</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="valCoding">5</div>
            <div class="metric-name">代码</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="valLanguage">25</div>
            <div class="metric-name">语言</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="valMultimodal">0</div>
            <div class="metric-name">多模态</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="valAgent">0</div>
            <div class="metric-name">Agent</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Timeline Slider Panel -->
    <div class="slider-area">
      <div class="slider-container">
        <input type="range" id="timelineRange" class="timeline-range" min="0" max="6" value="0" step="1">
        <div class="timeline-ticks">
          <span class="tick active" onclick="setStep(0)">2018</span>
          <span class="tick" onclick="setStep(1)">2020</span>
          <span class="tick" onclick="setStep(2)">2022</span>
          <span class="tick" onclick="setStep(3)">2023</span>
          <span class="tick" onclick="setStep(4)">2024</span>
          <span class="tick" onclick="setStep(5)">2025</span>
          <span class="tick" onclick="setStep(6)">2026</span>
        </div>
      </div>
      <div class="controls">
        <button id="playBtn" class="play-btn">
          <span id="playIcon">▶</span> <span id="playText">自动演示 (Autoplay)</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Evolutionary Timeline Data
    const stepsData = [
      {
        year: "2018",
        badge: "语义起源",
        title: "2018年：预训练的黎明",
        models: "GPT-1, BERT",
        desc: "大参数预训练模型概念初啼。具备基本的上下文序列预测能力，能够写出简短但漏洞百出的短句。几乎为零的逻辑推理和代码生成能力，主要用于情感分析等简单判别任务。",
        scores: [10, 5, 25, 0, 0]
      },
      {
        year: "2020",
        badge: "规模化突破 (Scaling)",
        title: "2020年：少样本涌现",
        models: "GPT-3 (175B)",
        desc: "参数量正式突破千亿级（1750亿）。涌现出令人吃惊的“少样本学习（In-context Learning）”能力。能写简单的单文件冒泡排序，写诗写散文，但事实幻觉非常严重，极难对齐用户指令。",
        scores: [25, 15, 45, 0, 5]
      },
      {
        year: "2022",
        badge: "人机对齐 (RLHF)",
        title: "2022年：指令对话普及",
        models: "InstructGPT, GPT-3.5 (ChatGPT)",
        desc: "人类反馈强化学习（RLHF）被成功应用，AI 正式学会了“聊天对话”和“承认错误”。意图遵循能力质变，可以进行多轮复杂交互，独立完成基本的前端脚本编写和常规常识问答。",
        scores: [50, 45, 70, 10, 20]
      },
      {
        year: "2023",
        badge: "黄金发展期",
        title: "2023年：专业逻辑与多模态",
        models: "GPT-4, Claude 2, Llama 2",
        desc: "多模态视觉理解正式进入实用。模型推理逻辑发生飞跃，能通过人类律师/医师资格考试。具备中等规模的软件工程编写能力，单次长上下文处理能力提升至 10 万 Token，AI 开始成为辅助副驾驶。",
        scores: [70, 65, 80, 50, 35]
      },
      {
        year: "2024",
        badge: "实时交互与工具调用",
        title: "2024年：实时多模态与长上下文",
        models: "GPT-4o, Gemini 1.5 Pro, Claude 3.5 Sonnet",
        desc: "语音、视频与文本原生的多模态全能（Omni）时代。上下文窗口达到革命性的数百万 Token，AI 具备高度可靠的外部 API/工具调用能力，支持初级自主软件开发代理（Dev Agent）的部署。",
        scores: [82, 75, 88, 75, 60]
      },
      {
        year: "2025",
        badge: "系统 2 推理革命",
        title: "2025年：思考推理与长考机制",
        models: "OpenAI o3-mini, DeepSeek-R1, Claude 3.7 Sonnet",
        desc: "大模型进入“思考链（Thinking Trace）”时代。在生成内容前通过强化学习进行长考，编码能力达到竞赛级水平。Agent 规划路径大幅延长，能自主进行多步骤代码联调与漏洞检测。",
        scores: [92, 90, 92, 85, 82]
      },
      {
        year: "2026",
        badge: "前沿超体与自主防御",
        title: "2026年：高度自主进化与攻防",
        models: "Claude Mythos Preview, GPT-5.5, Gemini 3.5 Pro",
        desc: "前沿安全攻防阶段。以 Project Glasswing 为代表的受控模型具备恐怖的自主系统级漏洞扫描与挖掘能力。在科学计算、网络安全防卫、全自动多智能体对抗方面表现出超越常人的高级心智。",
        scores: [99, 98, 99, 96, 98]
      }
    ];

    const cx = 100, cy = 100, maxR = 80;
    const n = 5; // 5 dimensions

    // Calculate Coordinates for Radar Chart Polygon based on Scores (0-100)
    function getPointsStr(scores) {
      return scores.map((val, i) => {
        const [x, y] = getRadarCoord(val, i);
        return `${x},${y}`;
      }).join(" ");
    }

    function getRadarCoord(value, index) {
      const fraction = value / 100;
      const r = maxR * fraction;
      // Angle: 0 is top (-90 degrees), goes clockwise
      const angle = (index / n) * 2 * Math.PI - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      return [x, y];
    }

    // Update UI based on Current Step (0 - 6)
    function updateUI(step) {
      const data = stepsData[step];

      // Update Slider value and Tick styles
      document.getElementById("timelineRange").value = step;
      const ticks = document.querySelectorAll(".tick");
      ticks.forEach((tick, i) => {
        if (i === step) {
          tick.classList.add("active");
        } else {
          tick.classList.remove("active");
        }
      });

      // Update Text details
      document.getElementById("eraBadge").innerText = data.badge;
      document.getElementById("eraTitle").innerText = data.title;
      document.getElementById("eraModels").innerHTML = `代表模型：<strong>${data.models}</strong>`;
      document.getElementById("eraDesc").innerText = data.desc;

      // Update Numeric Score Cards
      document.getElementById("valReasoning").innerText = data.scores[0];
      document.getElementById("valCoding").innerText = data.scores[1];
      document.getElementById("valLanguage").innerText = data.scores[2];
      document.getElementById("valMultimodal").innerText = data.scores[3];
      document.getElementById("valAgent").innerText = data.scores[4];

      // Update SVG Polygon points
      const points = getPointsStr(data.scores);
      document.getElementById("valPoly").setAttribute("points", points);

      // Update Value dots positions
      data.scores.forEach((val, i) => {
        const [x, y] = getRadarCoord(val, i);
        const dot = document.getElementById(`dot${i}`);
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
      });
    }

    // Set step externally (tick click or slide)
    function setStep(step) {
      stopAutoplay();
      updateUI(step);
    }

    // Input slider event
    document.getElementById("timelineRange").addEventListener("input", (e) => {
      stopAutoplay();
      updateUI(parseInt(e.target.value));
    });

    // Autoplay implementation
    let playInterval = null;
    let isPlaying = false;

    function playNext() {
      const rangeInput = document.getElementById("timelineRange");
      let nextStep = parseInt(rangeInput.value) + 1;
      if (nextStep >= stepsData.length) {
        nextStep = 0;
      }
      updateUI(nextStep);
    }

    function startAutoplay() {
      isPlaying = true;
      document.getElementById("playIcon").innerText = "⏸";
      document.getElementById("playText").innerText = "暂停演示 (Pause)";
      playInterval = setInterval(playNext, 1800);
    }

    function stopAutoplay() {
      if (!isPlaying) return;
      isPlaying = false;
      document.getElementById("playIcon").innerText = "▶";
      document.getElementById("playText").innerText = "自动演示 (Autoplay)";
      clearInterval(playInterval);
      playInterval = null;
    }

    document.getElementById("playBtn").addEventListener("click", () => {
      if (isPlaying) {
        stopAutoplay();
      } else {
        startAutoplay();
      }
    });

    // Initialize with first step
    updateUI(0);
  </script>
</body>
</html>
